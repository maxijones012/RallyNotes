name: APK Android (Rally GPS AI)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['README.md']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Pruebas automatizadas Android (JVM)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Rally-GPS-AI-v0.2.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
