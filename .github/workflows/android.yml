name: APK Android (Rally GPS AI)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['README.md']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar codificador de audio
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            timeout 90s sudo apt-get update -qq
            timeout 90s sudo apt-get install -y -qq ffmpeg
          fi
      - name: Preparar audio offline redistribuible CarlFM
        run: |
          python3 -m pip install --disable-pip-version-check 'piper-tts==1.8.0'
          python3 scripts/generate_rally_voice.py
      - name: Pruebas automatizadas Android (JVM)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK de prueba con voz offline
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar audio dentro de APK
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names=[n for n in z.namelist() if n.startswith('res/raw/') and 'rally_carlfm' in n]
              # Android AAPT2 puede renombrar/comprimir los recursos raw en el APK,
              # pero el contenido audio también se valida antes con el script generador.
              print('Recursos raw de CarlFM en APK:',len(names))
              assert len(names) >= 130, 'Faltan clips pregrabados en APK'
          PY
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Rally-GPS-AI-v0.2.7-CarlFM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publicar Release v0.2.7 con APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v0.2.7
          cp app/build/outputs/apk/debug/app-debug.apk "Rally_GPS_AI_${VERSION}.apk"
          cat > release_notes.txt <<'EOF'
          Rally GPS AI 0.2.7 (versión de prueba para Android)

          - Interfaz más limpia: se quitó el encabezado grande.
          - Botones de 3D y VOZ abajo a la derecha.
          - Ajustes organizados por Navegación, Voz, Mapa e Idioma.
          - Vehículos GPS más grandes con tamaños Normal, Grande y Extra grande.
          - Selección de 24 marcadores, notas de rally y copiloto contextual.
          - Distancias habladas hasta 1.000 metros y audios CarlFM sin conexión.

          APK de prueba (debug): podés instalarla manualmente en Android. Algunas actualizaciones pueden exigir desinstalar la versión anterior si la firma es diferente. Respaldá tus GPX primero.
          Las notas derivadas del mapa son aproximadas y no sustituyen la señalización ni la conducción segura.
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Rally_GPS_AI_${VERSION}.apk" --clobber
          else
            gh release create "$VERSION" "Rally_GPS_AI_${VERSION}.apk" --target "$GITHUB_SHA" --title "Rally GPS AI ${VERSION}" --notes-file release_notes.txt --prerelease
          fi
