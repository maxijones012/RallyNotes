name: APK Android (Rally GPS AI)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['README.md']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar audio offline redistribuible CarlFM
        run: |
          python3 -m pip install --disable-pip-version-check 'piper-tts==1.8.0' 'imageio-ffmpeg==0.6.0'
          python3 scripts/generate_rally_voice.py
      - name: Pruebas automatizadas Android (JVM)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK de prueba con voz offline
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar audio dentro de APK
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names=[n for n in z.namelist() if n.startswith('res/raw/') and 'rally_carlfm' in n]
              # Android AAPT2 puede renombrar/comprimir los recursos raw en el APK,
              # pero el contenido audio también se valida antes con el script generador.
              print('Recursos raw de CarlFM en APK:',len(names))
              assert len(names) >= 130, 'Faltan clips pregrabados en APK'
          PY
      - name: Verificar integridad y firma de APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk=Path("app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 1000000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, "ZIP corrupto"
              names=set(z.namelist())
              assert "AndroidManifest.xml" in names
              assert "classes.dex" in names
              assert "resources.arsc" in names
          print("APK: contenido e integridad correctos")
          PY
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Rally-GPS-AI-v0.3.2-CarlFM-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publicar Release v0.3.2 con APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=v0.3.2
          cp app/build/outputs/apk/debug/app-debug.apk "Rally_GPS_AI_${VERSION}.apk"
          cat > release_notes.txt <<'EOF'
          Rally GPS AI 0.3.2 — refuerzo de navegación y usabilidad (PRE-RELEASE)

          - GPS y DEMO con interfaz más limpia, controles de planificación en dos filas.
          - La ruta recorrida se diferencia visualmente de lo que queda por delante.
          - Cambio de mapa noche/día desde Ajustes, sin perder el trazado.
          - Filtro de GPS impreciso/antiguo y permiso preciso antes de navegar.
          - Una ruta GPX no habilita recálculo automático de calles OSRM.
          - DEMO: PAUSA/REANUDAR real con conservación de posición y notas.
          - Movimiento interpolado del Subaru, sin saltos entre vértices.
          - Evita edición del mapa mientras hay GPS/DEMO en marcha.
          - Pantalla despierta durante navegación; teclado oculto tras elegir destino.
          - Voz de reductores señalados en OSM/manuales, sin interrumpir notas de curva.
          - Traducciones y pruebas de regresión en navegación, vehículos, voz y GPX.
          - Verificación de firma, contenido y clips offline en GitHub Actions.

          Manual de validación: docs/VALIDACION_MOTOROLA_0.3.2.md
          Registro de mejoras: docs/CHANGELOG_0.3.2.md
          Seguimiento de 200 tareas: docs/PLAN_MAESTRO_200_MEJORAS.md
          IMPORTANTE: las verificaciones en teléfono y rutas reales siguen pendientes.

          APK de prueba (debug): podés instalarla manualmente en Android. Algunas actualizaciones pueden exigir desinstalar la versión anterior si la firma es diferente. Respaldá tus GPX primero.
          Las notas derivadas del mapa son aproximadas y no sustituyen la señalización ni la conducción segura.
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Rally_GPS_AI_${VERSION}.apk" --clobber
          else
            gh release create "$VERSION" "Rally_GPS_AI_${VERSION}.apk" --target "$GITHUB_SHA" --title "Rally GPS AI ${VERSION}" --notes-file release_notes.txt --prerelease
          fi
